# see https://keras.io/api/optimizers/learning_rate_schedules/
# COPY the the scheduler and its args to the optimizer config file of your model to use
lr_scheduler: ExponentialDecay 
lr_scheduler_kwargs: # args needed to run the scheduler
  initial_learning_rate: 1e-5
  decay_rate: 0.99
  decay_steps: 10000
  staircase: True #  Boolean. If True decay the learning rate at discrete intervals.
###########################################################################
lr_scheduler: PiecewiseConstantDecay
lr_scheduler_kwargs:
  boundaries: [10000, 20000] # A list of Python numbers with strictly increasing entries, and with all elements having the same type as the optimizer step.
  values: [1e-5, 1e-6, 1e-7] # A list of Python numbers that specifies the values for the intervals defined by boundaries. It should have one more element than boundaries, and all elements should have the same type.
###########################################################################
lr_scheduler: PolynomialDecay
lr_scheduler_kwargs:
  initial_learning_rate: 1e-3  
  decay_steps: 10000 # A Python integer. Must be positive. 
  end_learning_rate: 1e-5 # A Python float. The minimal end learning rate.
  power: 2.0 # A Python float. The power of the polynomial. Defaults to 1.0.
  cycle: False # A boolean, whether it should cycle beyond decay_steps.
###########################################################################
lr_scheduler: InverseTimeDecay
lr_scheduler_kwargs:
  initial_learning_rate: 1e-3
  decay_steps: 10000 # #  A Python int. Number of steps to decay over.
  decay_rate: 0.5
  staircase: False # Whether to apply decay in a discrete staircase, as opposed to continuous, fashion.
###########################################################################
lr_scheduler: CosineDecay
lr_scheduler_kwargs:
  initial_learning_rate: 1e-3
  decay_steps: 10000 #  A Python int. Number of steps to decay over.
  alpha: 0.0 # : A Python float. Minimum learning rate value for decay as a fraction of initial_learning_rate.
  warmup_target: None # A Python float. The target learning rate for our warmup phase. Will cast to the initial_learning_rate datatype. Setting to None will skip warmup and begins decay phase from initial_learning_rate. Otherwise scheduler will warmup from initial_learning_rate to warmup_target.
  warmup_steps: 0 # A Python int. Number of steps to warmup over.
###########################################################################
lr_scheduler: CosineDecayRestarts
lr_scheduler_kwargs:
  initial_learning_rate: 1e-3
  first_decay_steps: 10000
  t_mul: 2.0 #  A Python float. Used to derive the number of iterations in the i-th period.
  m_mul: 0.5 #  A Python float. Used to derive the initial learning rate of the i-th period.
  alpha: 0.0 #  A Python float. Minimum learning rate value as a fraction of the initial_learning_rate.
###########################################################################
lr_scheduler: ReduceLROnPlateau
lr_scheduler_kwargs:
  factor: 0.5
  patience: 5
  min_lr: 1e-7
  verbose: True
  cooldown: 2
  min_delta: 1e-4