# see https://www.tensorflow.org/api_docs/python/tf/keras/optimizers
optimizer: Adam
learning_rate: 1e-4  # Align with the scheduler's initial_learning_rate
clipvalue: 1.0  # Reasonable for stability; monitor gradient clipping
# Learning rate scheduler: CosineDecayRestarts
lr_scheduler: CosineDecayRestarts
lr_scheduler_kwargs:
  initial_learning_rate: 1e-4  # Starting learning rate (matches optimizer)
  first_decay_steps: 5000  # Adjust based on total training steps (e.g., 10% of total steps)
  t_mul: 1.5  # Standard: doubles the cycle length after each restart
  m_mul: 0.9  # Standard: reduces the initial learning rate by 20% per restart
  alpha: 0.05  # Minimum learning rate = 1e-6, which is reasonable
