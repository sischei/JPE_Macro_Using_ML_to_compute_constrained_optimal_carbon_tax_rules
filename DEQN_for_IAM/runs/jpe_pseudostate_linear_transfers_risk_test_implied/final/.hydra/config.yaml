constants:
  constants: null
net:
  layers:
  - hidden:
      units: 512
      type: dense
      activation: gelu
      init_scale: 0.01
  - hidden:
      units: 512
      type: dense
      activation: gelu
      init_scale: 0.01
  - output:
      type: dense
      activation: linear
      init_scale: 0.05
  net_initializer_mode: fan_avg
  net_initializer_distribution: uniform
optimizer:
  optimizer: Adam
  learning_rate: 0.0001
  clipvalue: 1.0
  lr_scheduler: CosineDecayRestarts
  lr_scheduler_kwargs:
    initial_learning_rate: 0.0001
    first_decay_steps: 2500
    t_mul: 1.5
    m_mul: 0.8
    alpha: 0.01
run:
  N_sim_batch: 512
  N_episode_length: 70
  N_epochs_per_episode: 1
  N_minibatch_size: 64
  N_episodes: 10000
  keras_precision: float32
  sorted_within_batch: false
variables:
  states: null
  policies: null
  definitions: null
seed: 1082
STARTING_POINT: LATEST
CHECKPOINT_INTERVAL: 10
MAX_TO_KEEP_NUMBER: 1
MODEL_NAME: jpe_pseudostate_linear_transfers_risk_test_implied
initialize_each_episode: true
error_filename: error_file.txt
enable_check_numerics: false
loss_choice: mse
use_weight_adjustment: false
use_flex_checkpoint: true
reload_optimizer: true
use_loss_reweighting: false
print_weights_every_n_episodes: 10
reweighting_scheme: focal
