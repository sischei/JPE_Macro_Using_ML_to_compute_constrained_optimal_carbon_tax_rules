# see https://www.tensorflow.org/api_docs/python/tf/keras/optimizers
optimizer: Adam
learning_rate: 1e-4 #1e-5
clipvalue: 1.0
lr_scheduler: CosineDecay
lr_scheduler_kwargs:
  initial_learning_rate: 1e-4
  decay_steps: 1000000 #  A Python int. Number of steps to decay over.
  alpha: 0.01 
  warmup_target: 1e-4 
  warmup_steps: 0 # A Python int. Number of steps to warmup over.