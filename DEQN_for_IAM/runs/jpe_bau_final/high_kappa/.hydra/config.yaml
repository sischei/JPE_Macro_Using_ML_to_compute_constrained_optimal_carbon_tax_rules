constants:
  constants: null
net:
  layers:
  - hidden:
      units: 128
      type: dense
      activation: gelu
      init_scale: 0.01
  - hidden:
      units: 128
      type: dense
      activation: gelu
      init_scale: 0.01
  - output:
      type: dense
      activation: linear
      init_scale: 0.05
  net_initializer_mode: fan_avg
  net_initializer_distribution: uniform
optimizer:
  optimizer: Adam
  learning_rate: 1.0e-05
  clipvalue: 1
run:
  N_sim_batch: 512
  N_episode_length: 70
  N_epochs_per_episode: 1
  N_minibatch_size: 64
  N_episodes: 10000
  keras_precision: float32
  sorted_within_batch: false
variables:
  states: null
  policies: null
  definitions: null
seed: 763925
STARTING_POINT: LATEST
CHECKPOINT_INTERVAL: 10
MAX_TO_KEEP_NUMBER: 10
MODEL_NAME: jpe_bau_final
initialize_each_episode: true
error_filename: error_file.txt
enable_check_numerics: false
loss_choice: mse
use_flex_checkpoint: true
reload_optimizer: true
