# see https://www.tensorflow.org/api_docs/python/tf/keras/optimizers
optimizer: AdamW
learning_rate: 1e-5 #1e-5
optimizer_kwargs:
  clipnorm: 1.0
lr_scheduler: CosineDecay
lr_scheduler_kwargs:
  initial_learning_rate: 1e-7
  decay_steps: 10000 #  A Python int. Number of steps to decay over.
  alpha: 0.1 # : A Python float. Minimum learning rate value for decay as a fraction of initial_learning_rate.
  warmup_target: 1e-5 # A Python float. The target learning rate for our warmup phase. Will cast to the initial_learning_rate datatype. Setting to None will skip warmup and begins decay phase from initial_learning_rate. Otherwise scheduler will warmup from initial_learning_rate to warmup_target.
  warmup_steps: 50000 # A Python int. Number of steps to warmup over.